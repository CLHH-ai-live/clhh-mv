services:
  app:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - ./.runtime/deploy:/data
    shm_size: 1gb
    mem_limit: 6g
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

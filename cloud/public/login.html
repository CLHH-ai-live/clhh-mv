<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CLHH MV 创作</title>
    <link rel="stylesheet" href="/web/login.css" />
  </head>
  <body>
    <main>
      <form id="login">
        <div class="brand">CLHH</div>
        <h1>MV 创作</h1>
        <p>邮箱验证后登录，首次使用自动注册。</p>
        <label
          >邮箱<input
            name="email"
            type="email"
            required
            maxlength="254"
            autocomplete="email"
            placeholder="you@example.com" /></label
        ><label
          >验证码
          <div class="otp-row">
            <input
              name="otp"
              aria-label="验证码"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              autocomplete="one-time-code"
              placeholder="6 位验证码"
              required
            /><button id="send-code" type="button">获取验证码</button>
          </div></label
        ><button id="submit" type="submit">注册 / 登录</button>
        <p id="error" role="status" aria-live="polite"></p>
        <p class="price-note">
          按音频时长计费 · 每 180 秒 ¥30<br />支持微信扫码充值，视频自动保存到云端。
        </p>
      </form>
    </main>
    <script src="/web/login.js" type="module"></script>
  </body>
</html>

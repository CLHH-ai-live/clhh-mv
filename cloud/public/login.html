<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CLHH MV 创作</title>
    <link rel="stylesheet" href="/web/login.css" />
  </head>
  <body>
    <main>
      <form id="login">
        <div class="brand">CLHH</div>
        <h1>MV 创作</h1>
        <p>验证码登录，首次使用自动注册。</p>
        <div class="login-methods" role="group" aria-label="登录方式">
          <button type="button" data-method="email" aria-pressed="true">邮箱登录</button>
          <button type="button" data-method="phone" aria-pressed="false">手机登录</button>
        </div>
        <label id="phone-field" hidden>手机号（+86）<input name="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="中国大陆手机号" maxlength="20" required disabled /></label>
        <label id="email-field"
          >邮箱<input
            name="email"
            type="email"
            required
            maxlength="254"
            autocomplete="email"
            placeholder="you@example.com" /></label
        ><label
          >验证码
          <div class="otp-row">
            <input
              name="otp"
              aria-label="验证码"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              autocomplete="one-time-code"
              placeholder="6 位验证码"
              required
            /><button id="send-code" type="button">获取验证码</button>
          </div></label
        ><button id="submit" type="submit">注册 / 登录</button>
        <p id="error" role="status" aria-live="polite"></p>

      </form>
    </main>
    <script src="/web/login.js" type="module"></script>
  </body>
</html>
